name: Sync and Deploy Astro Blog

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  sync-blog-content:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout blog-content branch
        run: |
          git checkout blog-content
          git pull origin blog-content

      - name: Merge main into blog-content
        run: |
          git merge origin/main --no-edit

      - name: Push blog-content
        run: |
          git push origin blog-content

  build-and-deploy:
    needs: sync-blog-content
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outcome }}
    environment:
      name: production
      url: https://blog.cloverta.top

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}

    steps:
      - name: Checkout blog-content branch
        uses: actions/checkout@v7
        with:
          ref: blog-content

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build Astro site
        run: npm run build

      - name: Install rsync and ssh client
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to server
        id: deploy
        run: |
          rsync -avz --delete \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            -e "ssh -p ${DEPLOY_PORT}" \
            dist/ \
            ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

      - name: Submit to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: '${{ vars.SITE_URL }}sitemap-index.xml'
          key: ${{ vars.INDEXNOW_KEY }}
          lastmod-required: false
          endpoint: api.indexnow.org
          limit: 1000

  manual-deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outcome }}
    environment:
      name: production
      url: https://blog.cloverta.top

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}

    steps:
      - name: Checkout blog-content branch
        uses: actions/checkout@v7
        with:
          ref: blog-content

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build Astro site
        run: npm run build

      - name: Install rsync and ssh client
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to server
        id: deploy
        run: |
          rsync -avz --delete \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            -e "ssh -p ${DEPLOY_PORT}" \
            dist/ \
            ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
      
      - name: Submit to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: '${{ vars.SITE_URL }}sitemap.xml'
          key: ${{ vars.INDEXNOW_KEY }}
          lastmod-required: false
          endpoint: api.indexnow.org
          limit: 1000

  refresh-cdn:
    name: Refresh Alibaba Cloud CDN
    needs: [build-and-deploy, manual-deploy]
    # One deployment path is skipped; refresh only after a successful upload.
    if: >-
      ${{ !cancelled() &&
          (needs.build-and-deploy.outputs.deployed == 'success' ||
           needs.manual-deploy.outputs.deployed == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: production
      url: https://blog.cloverta.top
    steps:
      - name: Checkout blog-content branch
        uses: actions/checkout@v7
        with:
          ref: blog-content

      - name: Refresh Alibaba Cloud CDN
        uses: ./.github/actions/refresh-cdn
        with:
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          refresh-url: ${{ vars.SITE_URL || 'https://blog.cloverta.top/' }}
